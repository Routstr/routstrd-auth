services:
  routstrd:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: routstrd
    volumes:
      - routstrd-data:/data
    environment:
      - PORT=${PORT:-8008}
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const r=await fetch('http://localhost:${PORT:-8008}/health');process.exit(r.ok?0:1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  routstrd-data:
